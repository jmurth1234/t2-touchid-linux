# Copy this file to .github/workflows/ci.yml to enable it.
name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y shellcheck build-essential libssl-dev
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile src/*.py tests/*.py
      - run: T2_TOUCHID_USER=test python -m unittest discover -s tests -v
      - run: shellcheck install.sh uninstall.sh src/*.sh tools/*.sh tools/macos/*.sh
      - run: make -C src t2-aks-tool
      - run: tools/privacy-check.sh
