name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck build-essential libssl-dev
          python -m pip install --requirement requirements.txt
      - name: Compile Python sources
        run: python -m py_compile src/*.py tests/*.py
      - name: Run unit tests
        env:
          T2_TOUCHID_USER: test
        run: python -m unittest discover -s tests -v
      - name: Check shell scripts
        run: shellcheck install.sh uninstall.sh src/*.sh tools/*.sh tools/macos/*.sh
      - name: Build the userspace tools
        run: make -C src t2-aks-tool t2-pam-fingerprint-prompt
      - name: Check public-tree privacy
        run: |
          tools/privacy-check.sh
          enrollment_research/scripts/check-public-tree.sh
